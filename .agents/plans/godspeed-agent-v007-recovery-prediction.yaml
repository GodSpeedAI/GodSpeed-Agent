# =============================================================================
# PLAN: godspeed-agent-v007-recovery-prediction
# =============================================================================
schema: agent.development_plan
schema_version: "1.0"

metadata:
  id: "godspeed-agent-v007-recovery-prediction"
  title: "v007 conditional recovery predictor: failure-episode construction, R0/R1 prediction points, LR-vs-LightGBM on the NeoHorse-derived representation"
  status: "in_progress"
  version: "0.1.0"
  created: "2026-09-15"

  purpose: >-
    Build and evaluate a dedicated, advisory recovery predictor — given that a
    meaningful execution failure just occurred, does the observable state
    indicate the agent will recover and subsequently reach settlement — as a
    new experiment (v007) built on v006's corpus infrastructure and
    NeoHorse-derived representation, with v006 preserved untouched as
    historical evidence.

# -----------------------------------------------------------------------------
# SOURCE AUTHORITY
# -----------------------------------------------------------------------------
source:
  spec:
    intended_repository_path: null
    artifact_name: "operator-v007-mission-brief"
    spec_id: "REQ-V007"
    spec_version: "2026-09-15"
    sha256: null
    authority: normative
  supporting_sources:
    - path: ".agents/reports/godspeed-agent-v006-final.md"
      role: "historical v006 evidence (immutable): estimator-gap at failure-adjacent cuts, nebius zero-error finding, leakage-safe calibration pattern"
    - path: ".agents/plans/godspeed-agent-v006-dual-model.yaml"
      role: "settled v006 plan (naming, amendment disciplines, preregistration rules)"
    - path: "scripts/settlement_datasets/v006_features.py"
      role: "reusable cut-point feature extractors (v006@1 representation)"
    - path: "data/settlement_datasets/runs/hf-calibration-006-experiments/"
      role: "v006 experiment artifacts (immutable)"

# -----------------------------------------------------------------------------
# NORMATIVE REQUIREMENTS
# -----------------------------------------------------------------------------
requirements:
  REQ-V007-EPISODE: "Primary training unit is the failure episode (failure event + prediction-time state + subsequent behavior + recovery outcome + settlement outcome); not arbitrary prefixes."
  REQ-V007-TARGET: "recovery_success is preregistered operationally from observable events (failure; escape of failed state; resumed execution; verified terminal settlement); actions, tool changes, or claims alone never count as recovery."
  REQ-V007-POINTS: "R0 (immediately after failure) and R1 (after first genuine recovery attempt) evaluated separately; never pooled."
  REQ-V007-FEATURES: "Features contain only information available at or immediately after the prediction point; future events (including escape and terminal outcome) determine labels only, never features."
  REQ-V007-DATA: "Reuse admitted v006 sources where valid (nebius excluded for this problem — zero is_error events, v006-verified); search for at least one additional public dataset with genuine failures, post-failure behavior, defensible terminal outcomes, stable parent IDs, usable licensing; no lowered evidence standards; if none exists, proceed and mark cross-domain generalization unresolved."
  REQ-V007-MODELS: "R-LR (LogisticRegression) vs R-LGBM (LGBMClassifier) on identical episodes/partitions/features; no ensemble."
  REQ-V007-SPLITS: "Split by strongest available parent/task/repository grouping; all episodes of one group in one partition; parent-balanced training weights (1/training-episodes-per-parent)."
  REQ-V007-PREREG: "Freeze recovery definition, datasets, R0/R1 schemas, grouping, weighting, hyperparameter bounds, primary/secondary metrics, calibration, acceptance criteria before final training; final test evaluates, never redesigns."
  REQ-V007-EVALUATION: "Per-point metrics (ROC-AUC, AP, Brier, calibration/ECE, balanced accuracy, precision, recall, F1, confusion matrix); per-source + macro-source; LOSO where possible; identity-removed variants; feature importance/coefficients; representative correct/incorrect predictions."
  REQ-V007-HYPOTHESES: "Primary: LightGBM exploits feature interactions to beat LogisticRegression on recoverability discrimination. Secondary: the NeoHorse-derived representation beats a minimal v005-compatible recovery feature set at the same estimator. Neither assumed true."
  REQ-V007-RUNTIME: "No automatic deployment; establish a trustworthy signal first; advisory only; deterministic governance and verification stay authoritative; deployment model decided explicitly."
  REQ-V007-EVIDENCE: "No future-event leakage, no group leakage, defensible labels with legitimate consequence, repeated-episode weighting correct, terminal outcome never encoded in features; independent fresh critic + main-agent verification."
  REQ-V007-REPORT: "Final report .agents/reports/godspeed-agent-v007-recovery-final.md ending with exactly one of the four classifications and the smallest next move."

# -----------------------------------------------------------------------------
# CURRENT-STATE FINDINGS (main agent, 2026-09-15, from v006 evidence)
# -----------------------------------------------------------------------------
current_state_findings:
  v006_foundation:
    reusable_infrastructure:
      - "Corpus: data/settlement_datasets/corpora/v006-trajectories/{swegym_openhands,nebius_swe_agent}.jsonl (local-only) + corpus_manifest.json; swegym 1574 parents (240 S/1334 F), nebius 225 (59 S/166 F)"
      - "Cut-point extractors: v005_prefix_compatible_features(parent,k), v006_prefix_features(parent,k), extract_family_features, assert_grouped, assert_no_leaky_features (scripts/settlement_datasets/v006_features.py)"
      - "Runner patterns: grouped splits, parent-balanced weights, OOF isotonic calibration, disagreement accounting (run_v006_experiments.py)"
    v006_findings_relevant_here:
      - "LightGBM beat LogisticRegression at after_first_failure (0.6899 vs 0.6145) and after_first_recovery (0.6782 vs 0.6148) cuts — the estimator-gap motivating v007"
      - "nebius has ZERO is_error events (v006-verified): unusable for failure episodes; excluded from v007 with that evidence"
      - "error/recovery/stuck-loop/verification features exist and are causally computed at any cut"
  episode_feasibility_measured:
    - "swegym corpus yields 6,987 failure episodes (maximal error-observation runs preceded by >=1 non-error observation), across 1,526 parents, mean 4.58 episodes/parent (parent balancing is load-bearing)"
    - "upper-bound positives (episodes in terminal-success parents): 865 (~12.4%)"
    - "swegym instance_ids parse into 1,382 distinct repositories — repository-level grouping feasible"
  preserved:
    - "All v006 artifacts, runs, reports, and reported results immutable; v007 writes under new paths only"

# -----------------------------------------------------------------------------
# COORDINATOR DECISIONS (frozen here; the preregistration embeds them verbatim)
# -----------------------------------------------------------------------------
coordinator_decisions:
  failure_episode:
    definition: >-
      An episode opens at the first error observation of a MAXIMAL RUN of error
      observations (intervening actions allowed — they belong to the failed
      state) that is preceded by at least one non-error observation (so
      leading context errors do not open episodes). The failure event = that
      opening error observation. Later error observations of the same run are
      part of the same failed state, not new episodes.
    eligibility: >-
      The opening error observation must not be the trajectory's final event
      (an episode with no observable subsequent behavior is not a prediction
      problem). Excluded episodes are counted with the reason.
  escape_event_label_component:
    definition: >-
      Escape = the first non-error observation strictly after the opening
      error observation. This is a future, label-side quantity only.
  recovery_success_target:
    definition: >-
      recovery_success = 1 iff (parent terminal label = 1) AND (an escape
      event exists after the episode's failure point). All other episodes are
      0. An escape without eventual verified settlement is NOT recovery;
      a changed tool or another action alone is NOT recovery; terminal success
      with no observable escape (trailing-error edge case) is labeled 0 and
      counted in a preregistered label-audit bucket.
  prediction_points:
    R0: "Feature window closes at the failure event (opening error observation, inclusive)."
    R1: "Feature window closes at the first ACTION event strictly after the opening error observation (the recovery attempt, inclusive). Episodes with no post-failure action are R0-only; counted."
  splits: "group_key = <dataset>:<repository> parsed from instance_id (strongest available task/repository grouping); GroupShuffleSplit test_size=0.20 random_state=42 over groups; model selection GroupKFold(5) on train groups only; test touched once."
  weights: "Training weight = 1/(number of training episodes of that parent); source-balanced sensitivity arm only if preregistered trigger fires (source ratio > 3:1)."
  estimators: "LogisticRegression(class_weight='balanced', max_iter=1000, solver='lbfgs', random_state=42, C∈{0.01,0.1,1.0}); LGBMClassifier(random_state=42, verbose=-1, n_estimators∈{150,400}, num_leaves∈{15,31}, learning_rate∈{0.05,0.1}, min_child_samples∈{20,50}, subsample=0.9, colsample_bytree=0.9, reg_lambda=1.0); selection by train-CV ROC-AUC, tiebreak AP."
  metrics: "Primary: episode-level ROC-AUC, reported separately per point (R0, R1). Secondary: AP, Brier, ECE, balanced accuracy, precision/recall/F1 at fixed 0.5, confusion matrix, parent-aggregated AUC (episode-multiplicity inflation check), per-source, macro-source, LOSO (if ≥2 admitted sources), identity-removed variants, LR coefficients / LGBM importances, representative correct+incorrect examples."
  calibration: "OOF (GroupKFold) isotonic on train only if selected model's OOF ECE > 0.05 (v006 leakage-safe pattern); never fit on test."
  acceptance:
    primary_hypothesis: "R-LGBM beats R-LR by ≥ +0.02 ROC-AUC at a prediction point AND direction holds in per-source cells AND is not reversed by identity removal."
    secondary_hypothesis: "v006 representation beats a preregistered minimal v005-compatible recovery feature set by ≥ +0.02 ROC-AUC at the same estimator and point."
    runtime_consequence: "Either hypothesis passing establishes the signal; runtime integration remains a separate, explicitly decided follow-up (no auto-deploy)."

# -----------------------------------------------------------------------------
# TARGET SETTLEMENT
# -----------------------------------------------------------------------------
target_settlement: >-
  A preregistered, independently audited recovery predictor over failure
  episodes: defensible episode construction with automated purity/grouping
  tests, separate R0/R1 evaluation, LR-vs-LightGBM comparison, representation
  ablation, per-source/calibration/importance reporting, fresh-critic verdict,
  an explicit no-auto-deploy runtime posture, and a final report ending with
  exactly one of the four classifications and the smallest justified next move.

# -----------------------------------------------------------------------------
# OPERATING CONTRACT
# -----------------------------------------------------------------------------
operating_contract:
  core_principle: >-
    Recovery is an outcome with observable downstream consequence, never an
    action, a tool change, or a claim; features see only the past of the
    prediction point; adoption language follows mechanically from frozen
    criteria.
  rules:
    - "v006 artifacts/reports/results immutable; v007 writes only new paths."
    - "Preregistration frozen before final training; final test evaluates."
    - "R0 and R1 never pooled into one task."
    - "Future events (escape, terminal outcome) live on the label side only."
    - "All episodes of one group in one partition; parent-balanced training weights."
    - "No invented datasets or labels; admissibility six conditions enforced for any new source."
    - "Advisory only: no policy decisions implemented; deterministic governance authoritative."
    - "Subagent summaries are never proof; main agent inspects diffs and reruns gates."
  claim_states: [OBSERVED, INFERRED, DECIDED, ASSUMED, UNKNOWN]
  correction_protocol:
    - "Preserve failed evidence; classify; correct the smallest falsified layer; rerun gates; never weaken acceptance."
  scope_control: "Discoveries that do not block a REQ-V007-* requirement go to .agents/OBSERVED_DEBT.md."

# -----------------------------------------------------------------------------
# ARTIFACTS
# -----------------------------------------------------------------------------
artifacts:
  current_status: ".agents/current_status.yml"
  evidence_root: "data/settlement_datasets/runs/v007-recovery/"
  reports_root: ".agents/reports/"
  corpus_rule: "Reuse the v006 corpus; any new admitted source extends configs/settlement_datasets/v007_episodes.yaml (new file), never edits v006 config/artifacts."
  commit_rule: "Same licensing discipline as v006: no trajectory-content commits from ambiguous-license sources; episode tables carry derived markers only."

# -----------------------------------------------------------------------------
# VERIFICATION MODEL
# -----------------------------------------------------------------------------
verification:
  global_gates:
    - id: GATE_UNIT
      command: "uv run pytest tests/test_v007_episodes.py tests/test_v007_features.py tests/test_v007_experiments.py tests/test_v006_features.py -q"
    - id: GATE_FULL
      command: "uv run pytest -q"
    - id: GATE_VALIDATE
      command: "uv run python -m godspeed_nav.cli validate --workspace-root . --storage-root .godspeed-harness/validation"
    - id: GATE_DOCS
      command: "uv run pytest tests/test_docs_alignment.py -q"
  proof_levels:
    P1: "behavioral + teeth"
    P2: "invariant-sensitive (leakage, purity, balance) — adversarial teeth + evidence"
    P3: "settlement-critical (preregistered experiments, adoption) — frozen preregistration + fresh independent confirmation"

