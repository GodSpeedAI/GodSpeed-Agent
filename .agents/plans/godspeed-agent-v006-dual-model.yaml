# -----------------------------------------------------------------------------
# OPERATOR AMENDMENTS (2026-09-15, items 1-12) — incorporated
# -----------------------------------------------------------------------------
operator_amendments:
  amendment_1_H_A_P: "Three baselines separated (see baselines:). GAP-01 resolution revised accordingly."
  amendment_2_matrix: "Experiment matrix corrected by prediction task: full-trajectory arms {H, A-full, C-full, optional v006-full} separate from prefix arms {P-A, P-B, P-C, P-D}; prefix family is the PRIMARY causal experiment; representation gain claims require same prediction point and same parent population."
  amendment_3_parent_balance: "Grouped splits necessary but not sufficient; parent-balancing via sample_weight = 1/(training prefixes per parent) (both estimators accept sample_weight; chosen) or preregistered bounded-prefix sampling fallback."
  amendment_4_per_cut: "Prefix metrics reported per prediction point (early, 25%, 50%, after_first_failure, after_first_recovery, pre_terminal) with eligible-parent counts and class balance; combined metric only parent-balanced and never replacing per-cut results."
  amendment_5_source_balance: "Pooled + per-source + macro-averaged metrics; source weighting/bounded sampling only if preregistered before final-test examination; corrected ingestion may shift source mixture vs H — never silently."
  amendment_6_runtime_contract: "Before T07: document current operational contract (trained offline vs fit at runtime, data, prediction, consumers); existing affordance/settlement-history predictor and new trajectory-prefix predictor kept separate unless evidence shows same problem; new surface is additional + advisory; no consumer-semantics changes to fit the diagram."
  amendment_7_artifacts: "Persist experiment/training artifacts for reproducibility; operational deployment model (static pretrained artifact vs runtime refit vs hybrid) is an explicit, separately surfaced decision; do not silently bundle persisted production models into v006."
  amendment_8_gap03: "H preserved as evidence; anomalies diagnosed (done in T00, verified); correct ingestion where justified; build contemporary corpus; record current SHAs; state historical revisions unrecoverable; final report must not write 'v006 improved from 0.8266' — use H/A/P comparable language."
  amendment_9_gap06: "Licensing recorded per source as identified/absent/ambiguous/incompatible; no committed trajectory-content corpus from unclear-license sources; no silent inference from prior use."
  amendment_10_gap09: "'v005 full-trajectory semantics' vs 'v005-prefix-compatible projection' named explicitly; never implied mathematically identical; prefix-incompatible v005 features omitted and omission recorded."
  amendment_11_prereg: "Preregistration frozen before final training with the expanded content list (see REQ-V006-PREREG); final-test evidence evaluates the preregistered system, never redesigns it."
  amendment_12_table: "Final report carries the H/A-full/C-full/P-A/P-B/P-C/P-D evidence table; additional arms only for specific questions."

