- id: require_explicit_settlement_for_failure
  status: refine
  status_reason: Historical late-trigger variant preserved for comparison; it labels
    settled failure rather than intervening before closure.
  supersedes: null
  superseded_by: require_failure_evidence_before_stopping_on_test_failure
  trigger:
    settlement_quality: failure_with_signal
    has_failure_condition_evidence: true
  negative_conditions:
  - settlement_quality_is_not_failure_with_signal
  - no_failure_condition_evidence_available
  required_evidence:
  - settlement_quality_is_failure_with_signal
  - failure_condition_has_observable_evidence_test_output_error_message_or_tool_feedback
  action:
    require_operator: failure_analysis
    record: error_correction_signal
  shadow_action: historical_failure_settlement_marker
  rationale: Failures with observable signals should produce explicit error-correction
    data backed by actual failure condition evidence.
  false_positive_risk: low
  payment_risk: low
