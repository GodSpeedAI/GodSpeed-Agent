name: tests

on:
  pull_request:
  push:
    branches: [main, "audit-corrections/**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The developmental-memory tests drive the RuVector Node bridge.
      - name: Install RuVector
        working-directory: tools/ruvector
        run: npm ci
      - name: Run the suite
        run: uv run --frozen --extra dev --extra ml pytest -q
