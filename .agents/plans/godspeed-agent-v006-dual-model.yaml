# -----------------------------------------------------------------------------
# FINAL ACCEPTANCE
# -----------------------------------------------------------------------------
final_acceptance:
  experiments:
    - "Two separated families executed per frozen preregistration: {H reference, A-full, C-full} + {P-A, P-B, P-C, P-D} (+ optional v006-full)."
    - "Parent-balanced weights honored; per-cut and per-source/macro metrics present; no unqualified pooled headline."
    - "Identity variants + LODO + calibration verdict present."
    - "No tuning against final test; preregistration frozen before final training."
  integrity:
    - "No target leakage, no future-prefix leakage, no parent across splits (test-proven)."
    - "Labels trace to source outcome fields only."
    - "H artifacts byte-identical to git HEAD; corpus trajectory content uncommitted; licensing statuses recorded."
  runtime:
    - "Operational contract documented; only earned components integrated as an additional advisory surface; degradation + no-averaging test-proven; deployment decision explicit; deterministic authority untouched."
  reporting:
    - "Final report contains every mandated section, the amendment-12 evidence table, H/A/P-separated language, exactly one classification, and the smallest justified next move."
    - "Docs/status updated; all global gates exit 0."

# -----------------------------------------------------------------------------
# GUARDRAILS
# -----------------------------------------------------------------------------
guardrails:
  - "H run artifacts immutable; historical behavior documented, never rewritten."
  - "Ingestion corrections are forward-looking; they define A, never H (amendment 8)."
  - "No external API dependencies beyond existing HF streaming; no global installs; dependency changes via pyproject/uv."
  - "Model outputs advisory; never bypass deterministic ranking, policy gates, settlement evidence rules."
  - "No trajectory-content commits from ambiguous-license sources; corpora local-only (amendment 9)."
  - "No invented labels/features; exclusions + omissions documented."
  - "LightGBM absent at runtime → LogisticRegression path with explicit degraded state."
  - "Existing runtime predictor semantics unchanged (amendment 6)."

# -----------------------------------------------------------------------------
# ROLLBACK / FALLBACK
# -----------------------------------------------------------------------------
rollback:
  strategy: >-
    All v006 work is additive (new modules, config, run dirs, one optional
    dependency, two minimal adapter corrections). Rollback = git revert of v006
    commits; H remains the historical record and the operative fallback at
    every point. Removing lightgbm degrades runtime per REQ-V006-RUNTIME.

