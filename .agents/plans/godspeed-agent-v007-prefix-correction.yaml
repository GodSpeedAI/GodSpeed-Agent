# -----------------------------------------------------------------------------
# THE BUG AND THE FIX (exact)
# -----------------------------------------------------------------------------
bug:
  location: "scripts/settlement_datasets/v006_features.py v005_prefix_compatible_features: elapsed_raw = parent['n_context_events'] + k"
  mechanism: "n_context_events counts context messages over the WHOLE trajectory; corpus events store no context positions, so prefix-time elapsed (and the 5 features derived from it) can include future context for sources with interleaved context (swe_smith 1271/3708 parents, up to 98 future messages; swegym 918/1574, up to 20; nebius 0/4554 — clean)."
  affected_features: [payment_predicted_total, payment_error, horizon_delta, risk_estimate, avg_actions_per_step]
fix:
  corpus: >-
    Additive schema field: each event gains "ctx" = number of context messages
    (roles outside the adapter's action/observation role sets) with message
    index strictly below the event's turn_index. Builders obtain context
    positions from the raw row at stream time via a new adapter method
    context_positions(raw) (implemented for swegym_openhands, nebius_swe_agent,
    swe_smith; base-class default returns [] and the corpus manifest records
    context_scoped per source). Parents otherwise byte-identical (deterministic
    rebuild, same revisions). Corrected corpus written to a NEW directory
    (v007c-trajectories) preserving v007-trajectories; manifest + summary note
    the derivation. Trailing-context diagnostics recorded per parent.
  features: >-
    v005_prefix_compatible_features: elapsed_raw = events[k-1]["ctx"] + k
    (prefix-scoped; exact). The five derived features inherit the fix; all
    other features untouched. Module docstring corrected (the "context-first"
    assumption language is replaced by the ctx-scoped rule). Schema tag
    v005_prefix_compatible bumped @1 -> @2 (semantics changed; names/count
    unchanged). v005_full_semantics@1 and v006@1 unchanged.
  prereg: "Amendment-2 appended: documents the correction as the audit-mandated narrowly-necessary schema change; every frozen cell listed in scope_lock reaffirmed."

