  T04:
    title: "v006 feature representation + v005-prefix-compatible projection + causal prefix generator"
    initial_status: blocked
    depends_on: ["T01", "T03"]
    proof_level: P2
    confirmation: builder_with_main_agent_review
    settles: ["REQ-V006-FEATURES", "REQ-V006-PREFIX", "REQ-V006-BALANCE"]
    changes: >-
      New scripts/settlement_datasets/v006_features.py providing THREE named
      feature families (amendments 1, 10): (a) v005_full_semantics — exact
      replication of the 11 v005 features over a complete trajectory
      (equivalence-tested against the H pipeline's formulas); (b)
      v005_prefix_compatible — the causal projection of that family onto a
      prefix (features without meaningful causal prefix interpretation omitted
      and the omission recorded — none expected, since T00 showed all 11 are
      prefix-recomputable, but the check is explicit); (c) v006 — the 17
      derivable + accepted conditional trajectory-state features from T01.
      Prefix generator produces the six canonical cuts (early=min(8 events,
      10%), pct25, pct50, after_first_failure, after_first_recovery,
      pre_terminal=all events strictly before the final event); undefined cuts
      skipped with per-cut yield counts. Frame builder emits
      (group_id=parent, prefix_kind, label, sample_weight_base, features…)
      where sample_weight_base = 1/prefix_count_of_parent (amendment 3; final
      training weights = base × preregistered source weight, if any).
    proves: "Every feature value computable from events at/before the cut; future-event mutation leaves vectors bit-identical; v005_full_semantics reproduces H formulas exactly on full trajectories; P family named and separated; all prefixes of a parent share one group id."
    does_not_prove: "Predictive value (T05)."
    hot_context:
      - "run_calibration_pipeline.py external_record_to_model_calibration (H formulas to replicate exactly)"
      - ".agents/reports/v006-data-and-features.md derivability table"
      - "KNOWN: fraction-of-final-length is EXCLUDED (leaks); evidence-acquisition admitted only as lexical observation novelty"
    steps:
      - "Implement the three families with a schema version tag; module docstring documents the H-vs-P semantic distinction verbatim."
      - "Prefix generator + per-cut yield accounting."
      - "tests/test_v006_features.py: purity (post-cut mutation invariance), v005 full equivalence vs external_record_to_model_calibration on fixture corpora, group integrity, per-cut yields, weight computation."
    gate:
      - "uv run pytest tests/test_v006_features.py -q"
    teeth:
      - attack: "Mutate events strictly after a cut."
        expected: "Feature vector bit-identical."
      - attack: "Compute prefix position as fraction of FINAL length."
        expected: "Rejected/excluded — leaks (tested)."
      - attack: "Ungrouped split helper."
        expected: "Group-integrity test fails it."
