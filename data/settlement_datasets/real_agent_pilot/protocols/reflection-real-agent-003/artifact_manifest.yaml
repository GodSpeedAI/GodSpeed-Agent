# Artifact Manifest

## Purpose

This document lists every artifact that must exist before the pilot is considered complete. The protocol verifier checks that all artifacts are present and conform to their expected schema.

## Pre-Execution Artifacts (created before any runs)

| Artifact | Path | Format | Description |
|---|---|---|---|
| Pilot protocol | `pilot_protocol.md` | Markdown | Master protocol document |
| Task specs (6) | `task_specs/task_{i-n}_spec.md` | Markdown | Detailed task specifications |
| Baseline runner prompt | `runner_prompts/baseline_runner_prompt.md` | Markdown | Prompt template for baseline runs |
| Guarded runner prompt | `runner_prompts/guarded_runner_prompt.md` | Markdown | Prompt template for guarded runs |
| Evaluator prompt | `evaluator_prompt.md` | Markdown | Blinded evaluation instructions |
| Skeptic prompt | `skeptic_prompt.md` | Markdown | Bias review instructions |
| Blinding plan | `blinding_plan.md` | Markdown | Blinding procedure and verification |
| Status gate | `status_gate.yaml` | YAML | Allowed/forbidden statuses and decision rules |
| Artifact manifest | `artifact_manifest.yaml` | YAML | This file |
| Deviation log | `deviation_log.md` | Markdown | Protocol deviation records (initially empty) |
| Protocol review checklist | `protocol_review_checklist.md` | Markdown | Verifier checklist |
| Fixture validation record | `fixture_validation.md` | Markdown | Evidence that task workspaces fail/pass as specified before execution |

