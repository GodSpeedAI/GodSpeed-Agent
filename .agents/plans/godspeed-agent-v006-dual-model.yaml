# =============================================================================
# PLAN: godspeed-agent-v006-dual-model
# =============================================================================
schema: agent.development_plan
schema_version: "1.0"

metadata:
  id: "godspeed-agent-v006-dual-model"
  title: "v006 dual-model settlement classifier: richer trajectory-state features + LightGBM, experimentally validated against explicit H/A/P baselines"
  status: "in_progress"
  version: "0.3.0"
  created: "2026-09-15"
  amended: "2026-09-15 (operator amendments 1-12 incorporated; see operator_amendments)"

  purpose: >-
    Upgrade the settlement calibration classifier into an experimentally
    validated dual-model system (LogisticRegression + LightGBM) over a causally
    prefix-safe trajectory representation, with three explicitly separated
    baselines (historical H, contemporary A, prefix-compatible P), adopting
    only what controlled evidence earns while preserving the historical v005
    record untouched.

# -----------------------------------------------------------------------------
# SOURCE AUTHORITY
# -----------------------------------------------------------------------------
source:
  spec:
    intended_repository_path: null
    artifact_name: "operator-v006-mission-brief + amendments 1-12 (2026-09-15)"
    spec_id: "REQ-V006"
    spec_version: "2026-09-15-amend2"
    sha256: null
    authority: normative
  supporting_sources:
    - path: "https://arxiv.org/html/2609.08183v1"
      role: "NeoHorse-1 execution representation (distinctions only; §3.2 structural validation rules, §5.1 trace behaviors)"
    - path: "data/settlement_datasets/runs/hf-calibration-005-features/"
      role: "H — historical v005 artifacts (immutable)"
    - path: ".agents/reports/v006-v005-reconstruction.md"
      role: "T00 recon evidence (settled; verified by main agent)"
    - path: ".agents/reports/v006-data-and-features.md"
      role: "T01 research evidence (settled; verified by main agent)"

# -----------------------------------------------------------------------------
# BASELINE OBJECTS (operator amendment 1 — never conflate)
# -----------------------------------------------------------------------------
baselines:
  H:
    name: "historical v005 reference"
    definition: >-
      The completed hf-calibration-005-features run and its recorded artifacts
      (ROC-AUC 0.8266, AP 0.6291, balanced-acc 0.7428, F1 0.5208, Brier 0.1771).
      Uses the data and ingestion behavior that actually occurred, including
      the agenttrove local-file anomaly (100 rows) and 441 swallowed nebius
      adapter errors. Historical evidence only; artifacts immutable; never a
      comparison target for v006 claims.
  A:
    name: "A-full — contemporary reproduction baseline (control)"
    definition: >-
      Newly trained LogisticRegression on the current shared corpus with the
      current CORRECTED ingestion pipeline, current recoverable dataset
      revisions, and the shared grouped splits, using v005 full-trajectory
      feature semantics. A is NOT a reproduction of H (dataset revisions are
      unrecoverable and historical ingestion deviated from configuration);
      A vs H comparisons are forbidden as evidence of model improvement.
  P:
    name: "P — v005-prefix-compatible projection baseline"
    definition: >-
      The v005 feature family recomputed causally at a trajectory prefix cut.
      Feature names resemble v005 but the prediction point and therefore some
      feature semantics differ; it is never called the historical v005 model.
      Serves as P-A (prefix control arm) and as the P-C estimator ablation.
      Features without a meaningful causal prefix interpretation are omitted
      from P and the omission recorded (amendment 10).

# -----------------------------------------------------------------------------
# NORMATIVE REQUIREMENTS (frozen; amended IDs marked)
# -----------------------------------------------------------------------------
requirements:
  REQ-V006-BASELINE: "Historical v005 artifacts remain untouched; H/A/P baseline separation maintained everywhere results are reported."
  REQ-V006-DUAL: "LogisticRegression AND lightgbm.LGBMClassifier supported; predictions exposed independently; no silent averaging; disagreement inspectable."
  REQ-V006-FEATURES: "v005 full-trajectory semantics preserved and test-equivalent for full trajectories; v006 trajectory-state features deterministic and causally computable at the prediction point; unextractable features documented and excluded."
  REQ-V006-DATA: "Re-stream the three v005 sources with configured limits under CORRECTED ingestion (amendment 8); investigate Toucan-1.5M (screened: REJECTED, no verified terminal label); new sources only under the six admissibility conditions."
  REQ-V006-LICENSING: "Per-source license status recorded as identified/absent/ambiguous/incompatible; no committed corpus of trajectory contents from unclear-license sources; no permission inferred from prior use (amendment 9)."
  REQ-V006-PREFIX: "Prefix prediction supported before the outcome is known; six canonical cuts; future events never in features; all prefixes of one parent in one partition (test-proven)."
  REQ-V006-BALANCE: "Parent-balanced training influence: prefix sample_weight = 1/(training prefixes of that parent) or preregistered bounded-prefix sampling; per-cut reporting by prediction point; no pooled headline without qualification (amendments 3-4)."
  REQ-V006-SOURCEBALANCE: "Pooled, per-source, and macro-averaged cross-source metrics reported; no source silently dominates the headline; any source weighting preregistered before final-test examination (amendment 5)."
  REQ-V006-EXPERIMENTS: "Two separated experiment families (amendment 2): full-trajectory arms {H reference, A-full, C-full, optional v006-full} for ingestion/estimator effects; prefix arms {P-A, P-B, P-C, P-D} on identical parents/cuts/splits as the PRIMARY causal experiment for the new representation. Identity variants and LODO reported."
  REQ-V006-EVALUATION: "ROC-AUC, AP, balanced accuracy, precision, recall, F1, Brier, calibration behavior; grouped held-out; per-cut prefix metrics; LODO; identity-removed variants; calibration necessity verdict."
  REQ-V006-PREREG: "Frozen preregistration before final training covering datasets, revisions, inclusion/exclusion, parent identity, dedup, splits, prefix rule, parent weighting, source weighting (if any), feature schemas, target, calibration procedure, selection metric, secondary metrics, hyperparameter bounds, acceptance criteria (amendment 11)."
  REQ-V006-RUNTIME: "Existing on-the-fly-refit affordance predictor and the new trajectory-prefix predictor remain semantically separate surfaces; operational contract documented before integration; new predictor is an additional advisory surface; deployment model (static artifact vs runtime refit vs hybrid) decided explicitly, not silently bundled; LightGBM absence degrades gracefully with explicit reporting; no authority grant or gate bypass (amendments 6-7)."
  REQ-V006-EVIDENCE: "No target leakage, no future leakage, no parent across splits, defensible labels, dataset identity not carrying the classifier, artifacts match feature schemas, H intact; independent critique before settlement."
  REQ-V006-REPORT: "Final report with all mandated sections, the H/A/P-separated evidence table (amendment 12), comparable-language results, and one settlement classification."

