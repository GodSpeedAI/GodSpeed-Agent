[project]
name = "godspeed-agent-harness"
version = "0.1.0"
description = "Local-first horizon-centric cybernetic navigation harness for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Godspeed AI" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "datasets>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["scikit-learn>=1.4"]

[project.scripts]
godspeed-nav = "godspeed_nav.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
