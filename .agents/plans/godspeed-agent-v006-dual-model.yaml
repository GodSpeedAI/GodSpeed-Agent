      required_verdict: "CONFIRM or REJECT with evidence"
    redesign_trigger: "Corpus size/classes making preregistered endpoints underpowered → stop, document, re-preregister; never quietly switch endpoints."
    evidence: "data/settlement_datasets/runs/hf-calibration-006-experiments/"
    done_when:
