    evidence: "scripts/settlement_datasets/v006_features.py + tests"
    done_when:
      - "Three families implemented and named; purity + equivalence + grouping tests green; omissions (if any) recorded."

  T05:
    title: "Frozen preregistration + two-family experiment matrix + evaluation"
    initial_status: blocked
    depends_on: ["T02", "T04"]
    proof_level: P3
    confirmation: independent_adversarial
    settles: ["REQ-V006-EXPERIMENTS", "REQ-V006-EVALUATION", "REQ-V006-PREREG", "REQ-V006-BALANCE", "REQ-V006-SOURCEBALANCE"]
    changes: >-
      (1) .agents/reports/v006-experiment-preregistration.yaml FROZEN before
      final training, containing (amendment 11): admitted datasets + revision
      SHAs + inclusion/exclusion reasons (Toucan rejection cited); parent
      identity definition per dataset; deduplication rule; grouped split
      strategy (parent-level, seed fixed, test touched once); prefix-generation
      rule; parent weighting rule (1/n_train_prefixes; both estimators consume
      sample_weight); source weighting rule if corpus parent counts are highly
      unequal (bounded sampling OR weights — chosen before any final-test
      examination, or explicitly 'none'); feature schemas (three families);
      target definition; calibration procedure (out-of-fold isotonic or Platt
      on train CV if needed; never fit on test); model-selection metric
      (grouped-CV ROC-AUC primary, AP tiebreak); secondary metrics; small
      preregistered hyperparameter grid bounds; acceptance criteria.
      (2) scripts/settlement_datasets/run_v006_experiments.py executing:
      FULL-TRAJECTORY FAMILY {A-full: v005_full_semantics + LogisticRegression;
      C-full: same corpus/splits/features + LightGBM; optional v006-full arm
      only if it answers the estimator-family question on full semantics};
      PREFIX FAMILY (PRIMARY) {P-A: v005_prefix_compatible + LogisticRegression;
      P-B: v006 + LogisticRegression; P-C: v005_prefix_compatible + LightGBM;
      P-D: v006 + LightGBM}; identity variants (±dataset_id) for every arm;
      LODO per source; parent-balanced training weights throughout; per-cut
      metrics (eligible parents, class balance, ROC-AUC, AP, Brier, balanced
      acc, precision, recall, F1) plus parent-balanced pooled prefix metric
      clearly subordinated to per-cut results; pooled + per-source +
      macro-averaged metrics; calibration analysis (reliability, ECE,
      before/after out-of-fold calibration); disagreement analysis
      (|p_logit − p_lgbm|) distribution and its per-cut behavior. Results
      persisted under evidence_root with versions + seeds.
    proves: "Which of {representation P-A→P-B, estimator P-A→P-C, combined P-A→P-D} is real at each prediction point on identical parents/splits; whether dataset identity carries the classifier; how signal develops along trajectories; whether calibration is needed; estimator behavior on full trajectories (C-full vs A-full)."
    does_not_prove: "Local harness capability; trajectories outside the corpus; H-vs-A comparability."
    preregistration:
      required: true
      artifact: ".agents/reports/v006-experiment-preregistration.yaml"
      claim: >-
        Primary endpoint: parent-balanced pooled ROC-AUC difference P-B vs P-A
        on held-out test parents, with per-cut direction consistency as a
        gating condition. Secondary: P-C, P-D vs P-A; AP; identity-removed
        variants; LODO. Adoption requires preregistered material gains (see
        acceptance criteria in the frozen file).
      falsifier: >-
        P-B ≤ P-A on the primary endpoint, or gains present only with
        dataset_id and vanishing without it, or gains not direction-consistent
        across cuts, or calibration-only improvement (i.e., ranking unchanged).
      known_confounds:
        - "dataset identity as proxy for label priors (identity variants + LODO)"
        - "prefix-row correlation (parent balancing + grouped splits)"
        - "source mixture shift vs H (per-source + macro metrics; H never compared)"
        - "class imbalance (~20% success expected; balanced class weights fixed)"
      confirmation_condition: >-
        Independent critic (T06) finds no leakage/contamination/label defect
        and reproduces the primary comparison from the frozen corpus within
        rounding.
    hot_context:
      - "Corpus from T03; feature families from T04; lightgbm from T02"
      - "Test parents touched exactly once, after all frozen choices."
    steps:
      - "Draft preregistration from corpus stats; freeze; only then implement runner."
      - "Implement runner with grouping + weights + per-cut/per-source accounting; tests/test_v006_experiments.py (grouping enforced, label columns rejected, weights honored, reproducibility with fixed seed)."
      - "Execute matrix; persist results + manifest (versions, seeds, runtimes)."
      - "Summarize with H/A/P comparable language; include negative results."
    gate:
      - "uv run pytest tests/test_v006_experiments.py -q"
      - "preregistration file exists, frozen (committed) before results artifacts"
    teeth:
      - attack: "Random ungrouped split in a helper."
        expected: "Runner refuses; test proves refusal."
      - attack: "settlement_success/settlement_score among features."
        expected: "Whitelist rejects label columns; test proves."
      - attack: "Fit calibration transform on test fold."
        expected: "Runner structure prevents; audit test proves calibration uses out-of-fold train predictions only."
    independent_confirmation:
