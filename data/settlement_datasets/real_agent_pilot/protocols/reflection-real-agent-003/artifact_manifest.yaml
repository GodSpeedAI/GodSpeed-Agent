### pilot_summary.json

```json
{
  "pilot_id": "reflection-real-agent-003",
  "policy_id": "require_reflection_before_continuing_after_second_unresolved_error",
  "total_runs": 12,
  "baseline_runs": 6,
  "guarded_runs": 6,
  "status_recommendation": "needs_more_evidence",
  "metabolized": false,
  "globally_active": false,
  "checkpoint_delivered_count": 0,
  "results_by_pair": [],
  "evaluator_summary": {},
  "skeptic_verdict": {},
  "legitimate_conclusions": [],
  "protocol_errors": []
}
```

Numeric evaluator score fields may also be `"uncertain"` when evidence is missing. Any `"uncertain"` value must include a non-empty matching `*_missing_evidence_reason` field. Status calculations must explicitly exclude or handle uncertain dimensions.

### pilot_report.md

The pilot-specific report must include a claim-to-evidence table. Every interpretive claim must cite:
- run ID;
- task ID;
- condition;
- relevant step indices;
- evaluator evidence;
- skeptic disposition.

Each skeptic objection must be accepted, rebutted with cited evidence, or reflected in a status downgrade.

## Completeness Check

Before the pilot is considered complete, verify:
- [ ] All pre-execution artifacts exist.
- [ ] Fixture validation has been completed and independently reviewed.
- [ ] All execution artifacts exist.
- [ ] Raw transcripts exist for all 12 runs and checksums match.
- [ ] All task workspaces exist with correct files.
- [ ] Reset script restores all mutable files.
- [ ] `pilot_summary.json` has all required fields.
- [ ] `status_recommendation` is in the allowed set.
- [ ] `metabolized` is `false`.
- [ ] `globally_active` is `false`.
