    proves: "Two predictors remain semantically separate; earned surface loads/derives models matching their feature schema; both probabilities + disagreement exposed; degradation explicit; deterministic gates untouched; deployment decision documented."
    does_not_prove: "Runtime predictions improve local harness outcomes (no local settlement claims)."
    preregistration:
      required: true
      artifact: ".agents/reports/v006-runtime-integration.yaml"
      claim: "Only experiment-earned components wired as an additional advisory surface; existing consumer semantics byte-compatible; defaults unchanged unless T05 evidence justifies; deployment model explicitly chosen."
      falsifier: "Any averaged/silent fusion; any consumer-semantics change to fit the dual-model diagram; any bypass of deterministic ranking or policy gates; any silent new production-artifact architecture."
      known_confounds: ["artifact/schema drift", "feature-family conflation (full vs prefix)"]
      confirmation_condition: "Tests prove exposure, degradation, no-averaging, schema match; main agent verifies."
    hot_context:
      - "godspeed_nav/ml.py provider registry + gating patterns"
      - "tests/test_computation.py, tests/test_cli_hooks_mcp.py"
    steps:
