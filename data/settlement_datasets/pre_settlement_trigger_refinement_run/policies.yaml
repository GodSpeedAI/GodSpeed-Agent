policies:
- id: require_reflection_after_repeated_errors
  status: refine
  status_reason: Historical late-trigger variant preserved for comparison; fires after
    settlement feedback is already mostly spent.
  supersedes: null
  superseded_by: require_reflection_before_continuing_after_second_unresolved_error
  trigger:
    error_count_gte: 3
    errors_are_unresolved: true
  negative_conditions:
  - errors_are_resolved_in_subsequent_turns
  - error_count_is_only_analysis_mentions
  required_evidence:
  - at_least_3_error_outputs_from_environment_or_tool
  - errors_remain_unresolved_at_trace_end_or_last_3_turns
  action:
    require_operator: reflection
    block_next_action_until: revised_plan_exists
  shadow_action: historical_late_reflection_marker
  rationale: Repeated unresolved errors from environment/tool feedback indicate settlement
    feedback is not being metabolized.
  false_positive_risk: low
  payment_risk: low
  evidence:
    supporting_trace_count: 31
    supporting_dataset_count: 1
    supporting_datasets:
    - agenttrove
    total_traces_analyzed: 336
    example_trace_ids:
    - at-246aacd1cbab
    - at-61bf56ea495a
    - at-3c55c9fdb653
    - at-5f99897f51c6
    - at-1fa6dff6686c
    observed_failure_patterns:
    - tool_thrashing
    - payment_spiral
    - failed_recovery
    proportion: 0.092
    avg_label_confidence: 0.8
    confidence_distribution:
      min: 0.8
      max: 0.8
      mean: 0.8
    meets_min_supporting_count: true
  risk:
    false_positive_concern: Deterministic heuristics may misclassify some traces.
    recommended_review: Human review before activation in production harness.
  activation_status: proposed
  active_by_default: false
- id: require_reflection_before_continuing_after_second_unresolved_error
  status: proposed
  status_reason: null
  supersedes: require_reflection_after_repeated_errors
  superseded_by: null
  trigger:
    second_unresolved_error_before_continuing: true
  negative_conditions:
