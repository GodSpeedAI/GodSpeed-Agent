### Fixture Validation

`fixture_validation.md` must include, for each task:
- buggy-state test command and failing output summary;
- corrected-state test command and passing output summary;
- checksum of each frozen module and test file;
- checksum or command evidence for the reset fixture;
- evidence that baseline and guarded reset states are byte-identical.

No runner execution may begin until fixture validation is reviewed after task workspace implementation.

## Artifact Schemas

### events.jsonl

Each line:
```json
{
  "run_id": "run-NN",
  "step_index": 0,
  "timestamp": "ISO-8601",
  "event_type": "tool_call|tool_result|file_edit|model_message|user_message|operator_message|intervention|task_complete",
  "content": "description",
  "tool_name": "read|bash|edit|null",
  "is_error": false,
  "metadata": {}
}
```

Event extraction rules:
- Preserve raw transcripts before parsing.
- Assign monotonically increasing `step_index` values in transcript order.
- Record every user/operator message unless removed from blinded evaluator data by the blinding plan.
- Record the source raw transcript path and transcript checksum in event metadata.
- Do not infer success from agent claims alone; record `task_complete` only when the transcript contains the declaration and supporting test evidence is available.
- Any parser ambiguity that affects policy fire timing, condition assignment, or outcome classification must be recorded in `deviation_log.md`.

