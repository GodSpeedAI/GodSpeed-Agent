preregistration_id: v007-recovery
frozen_at: "2026-09-15"
plan: godspeed-agent-v007-recovery-prediction

# ---------------------------------------------------------------------------
# 1. RECOVERY DEFINITION (operational, observable-event-grounded)
# ---------------------------------------------------------------------------
recovery_definition:
  failure_episode:
    opening_rule: >-
      An episode opens at the first error observation (is_error=True) of a
      MAXIMAL RUN of error observations, where intervening actions belong to
      the failed state and the run is preceded by >=1 non-error observation
      (leading context errors never open episodes). Failure event index = e.
    eligibility: "e must not be the trajectory's final event (exclusion bucket failure_is_final_event; observed count: 0)."
  escape:
    definition: "First observation event with index > e and is_error=False. LABEL-SIDE ONLY; never a feature."
  target: >-
    recovery_success = 1 iff (parent terminal label == 1) AND (escape exists).
    Otherwise 0. Escape without eventual verified settlement is NOT recovery;
    a changed tool or another action alone is NOT recovery; terminal success
    with no observable escape is labeled 0 (bucket no_escape_with_settlement).
  rationale: >-
    Recovery requires observable downstream consequence: the agent must leave
    the failed state (escape observed) AND the trajectory must subsequently
    reach verified settlement. Both components are observable events; neither
    is an action, a tool change, or a claim.
  audit_buckets_frozen:
    escape_with_settlement: 8028
    escape_no_settlement: 26512
    no_escape_with_settlement: 414
    no_escape_no_settlement: 2472
    exclusion_failure_is_final_event: 0

