[project]
name = "godspeed-agent-harness"
version = "0.1.0"
description = "Local-first horizon-centric cybernetic navigation harness for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Godspeed AI" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "datasets>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["scikit-learn>=1.4"]

[project.scripts]
godspeed-nav = "godspeed_nav.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["godspeed_nav", "agentic_capability_loop"]

[tool.hatch.build.targets.sdist]
# Keep the source dist lean: ship only what's needed to install and run the CLI
# and the public event adapter plus its contract tests.
include = ["godspeed_nav", "agentic_capability_loop", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "agentic_capability_loop/tests"]
pythonpath = ["."]
