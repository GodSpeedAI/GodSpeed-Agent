# -----------------------------------------------------------------------------
# SURFACED INSTRUCTION GAPS (main agent, 2026-09-15 — not silently accepted)
# -----------------------------------------------------------------------------
# Original observations preserved; resolutions marked REVISED where amendments
# superseded them.
surfaced_instruction_gaps:
  - id: GAP-01
    gap: >
      Brief says "the existing trained v005 model must remain preserved as the
      baseline", but no persisted v005 model artifact exists: v005 produced
      metrics + a calibration frame only; godspeed_nav/ml.py refits
      LogisticRegression on-the-fly at runtime and the pipeline refits per run.
    original_resolution: >
      Baseline preservation = (a) v005 run artifacts byte-untouched, (b)
      experiment arm A reproduces v005 features + LogisticRegression on the
      shared corpus as the comparable baseline.
    revised_resolution: >
      AMENDED by operator amendment 1: three objects separated — H (historical
      record, immutable, never a comparison target), A (contemporary control on
      the shared corpus, NOT a reproduction of H), P (v005-prefix-compatible
      projection). A-vs-H deltas are forbidden as improvement evidence.
  - id: GAP-02
    gap: >
      "NeoHorse-1" is cited as the inspiration source; the paper exists at
      arxiv 2609.08183v1 and defines NO classifier feature set. Its transferable
      content is the deterministic structural-validation rule set (tool-call
      closure, orphan observations, unresolved internal calls, causal event
      order, duplicated/conflicting tool-call ids) and trace-analysis behavioral
      distinctions (evidence acquisition, edit-test-inspect-repair loops,
      verification after modification, strategy switching vs repeated failed
      attempts, interaction-budget efficiency).
    resolution: "CONFIRMED by T01: paper read and mined; distinctions mapped to 17 derivable + 2 conditional features; LLM-training architecture excluded."
  - id: GAP-03
    gap: >
      Configured limits were recovered but the executed v005 run did not honor
      them: agenttrove scanned 100 rows (max 5000), nebius logged 441 adapter
      errors; v005 recorded no dataset revision SHAs, so the exact v005 data
      revision is unrecoverable.
    original_resolution: "T03 re-streams with configured limits, verifies yields, diagnoses anomalies, records current SHAs."
    revised_resolution: >
      AMENDED by operator amendment 8: diagnosis COMPLETE (T00 — agenttrove
      local-file bug; nebius null-field crashes). T03 CORRECTS ingestion where
      justified instead of reproducing anomalies; H stays as historical
      evidence; final report uses H/A/P comparable language only.
  - id: GAP-04
    gap: >
      Prefix rows of one parent share the terminal label and are strongly
      correlated; grouped splitting alone still lets event-rich parents dominate
      training.
    original_resolution: "All splits grouped by parent; parent-level aggregation in metrics; known confound in preregistration."
    revised_resolution: >
      AMENDED by operator amendment 3: grouped splits PLUS explicit
      parent-balancing — sample_weight(prefix) = 1/(number of training prefixes
      for that parent); both estimators consume sample_weight; recorded in
      preregistration.
  - id: GAP-05
    gap: >
      Toucan-1.5M is synthetic tool-agent SFT data and likely lacks verified
      terminal outcomes.
    resolution: "CONFIRMED by T01: REJECTED for supervised training — no verified terminal label in any config; recorded with evidence."
  - id: GAP-06
    gap: >
      SWE-Gym/OpenHands-Sampled-Trajectories exposes no license field via HF
      API.
    original_resolution: "T01 checks card/repo licensing; absence surfaced."
    revised_resolution: >
      AMENDED by operator amendment 9: status recorded as AMBIGUOUS (dataset
      card license absent; companion GitHub Apache-2.0; formally undetermined).
      Consequence enforced in T03: no trajectory-content files from this source
      are committed; corpus stays local; feature-level aggregates (consistent
      with existing committed calibration_frame.csv practice) are commit-eligible.
      Licensing kept separate from statistical merits.
  - id: GAP-07
    gap: >
      The brief's runtime diagram implies runtime prefix prediction, but the
      existing runtime task (predict affordance candidates from settlement
      history) is a different prediction point than v006's trajectory-prefix
      success prediction.
    original_resolution: "T07 integrates an additional advisory surface loading persisted artifacts; existing consumers byte-compatible."
    revised_resolution: >
      AMENDED by operator amendments 6-7: T07 must FIRST document the current
      operational contract; the two predictors stay semantically separate;
      deployment model (static artifact vs runtime refit vs hybrid) is an
      explicit decision surfaced to the operator, not silently bundled;
      persisted experiment artifacts remain for reproducibility regardless.
  - id: GAP-08
    gap: >
      Early/25%/50% cuts coincide for very short trajectories;
      after-first-recovery is undefined without a recovery attempt.
    resolution: "STANDING (amendment 4 confirms): undefined cuts absent; per-cut eligible-parent counts reported; no synthetic padding."
  - id: GAP-09
    gap: >
      v005 features horizon_delta / risk_estimate / debt_estimate are derived
      proxies over the full trajectory; recomputing on prefixes changes
      semantics.
    original_resolution: "Exact replication for full trajectories (test-proven); causal recomputation on prefixes; difference documented."
    revised_resolution: >
      AMENDED by operator amendment 10: naming enforced — "v005 full-trajectory
      semantics" vs "v005-prefix-compatible projection"; prefix-incompatible
      features (if any are found during T04) are omitted from P and the
      omission recorded, never smuggled.

# -----------------------------------------------------------------------------
# TARGET SETTLEMENT
# -----------------------------------------------------------------------------
target_settlement: >-
  Immutable historical H; corrected contemporary ingestion producing a shared
  local corpus with recorded revisions and licensing statuses; a causally
  prefix-safe v006 extractor with purity and grouping tests; a frozen
  preregistration; completed two-family experiment matrix (A-full/C-full
  controls; P-A/P-B/P-C/P-D primary) with parent-balanced training, per-cut and
  per-source reporting, LODO, identity variants, and calibration analysis; an
  independent leakage/critique audit; an explicitly decided runtime posture
  (integration only if earned, separate advisory surface, deployment model
  surfaced); and a final report that separates H/A/P and states one settlement
  classification with the smallest justified next move.

# -----------------------------------------------------------------------------
# OPERATING CONTRACT
# -----------------------------------------------------------------------------
operating_contract:
  core_principle: >-
    Deterministic features from causally available events only; comparable
    claims only within the same corpus, prediction point, and parent
    population; adoption decided by the frozen preregistered matrix; H stays
    intact as historical record; v005 architecture remains the fallback.
  rules:
    - "Execute tasks by dependency; every task leaves the repository green."
    - "A subagent summary is never proof; the main agent inspects diffs and reruns gates."
    - "No tuning, threshold selection, or model selection against final-test parents."
    - "H artifacts byte-untouched; git-verified in T08."
    - "Ingestion corrections change A, never H; both facts documented."
    - "All prefixes of one parent in one partition; parent-balanced training weights."
    - "Future events never enter prefix features; prefix-purity tests prove it."
    - "No invented labels or features; per-source licensing recorded; no trajectory-content commits from ambiguous-license sources."
    - "Per-cut and per-source metrics accompany any pooled headline."
    - "Preregistration frozen before final training; final test evaluates, never redesigns."
    - "Runtime predictions advisory; deterministic ranking, gates, policies authoritative; existing predictor semantics unchanged."
  claim_states: [OBSERVED, INFERRED, DECIDED, ASSUMED, UNKNOWN]
  correction_protocol:
    - "Preserve failed evidence; classify the failure; correct the smallest falsified layer."
    - "Rerun gate + confirmation; append correction rounds; never weaken acceptance."
  scope_control: >-
    Discoveries that do not block a REQ-V006-* requirement go to
    .agents/OBSERVED_DEBT.md.

