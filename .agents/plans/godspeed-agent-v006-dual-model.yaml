      - "Implement earned surface + tests (schema match, degradation, no-averaging, advisory notes, separate-from-existing-predictor)."
      - "Record deployment-model decision + rationale."
    gate:
      - "uv run pytest tests/test_computation.py tests/test_cli_hooks_mcp.py -q"
    teeth:
      - attack: "Remove lightgbm from environment."
        expected: "LogisticRegression-only predictions with degraded=true; no crash; no silent mean."
      - attack: "Corrupt a model artifact's feature schema (if static artifacts chosen)."
        expected: "Load refuses with explicit error."
    redesign_trigger: "If evidence supports no runtime change, T07 becomes a documented no-op with the deployment decision recorded (do not integrate for architecture's sake)."
    evidence: ".agents/reports/v006-runtime-contract.md + .agents/reports/v006-runtime-integration.yaml + code/tests"
    done_when:
