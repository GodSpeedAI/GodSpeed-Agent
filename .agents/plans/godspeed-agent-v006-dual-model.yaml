  reports_root: ".agents/reports/"
  corpus_root: "data/settlement_datasets/corpora/v006-trajectories/  # LOCAL ONLY (gitignored; amendment 9)"
  commit_rule: >-
    Committed: corpus_summary.json (counts/SHAs/hashes, no trajectory content)
    in evidence_root; feature-level frames consistent with existing
    calibration_frame.csv practice. NOT committed: event-level corpus JSONL
    (contains trajectory content; swegym license ambiguous).
  status_rule: "current_status.yml is operational projection, never normative authority."

# -----------------------------------------------------------------------------
# VERIFICATION MODEL
# -----------------------------------------------------------------------------
verification:
  global_gates:
    - id: GATE_UNIT
      command: "uv run pytest tests/test_calibration_pipeline.py tests/test_settlement_datasets.py tests/test_v006_corpus.py tests/test_v006_features.py tests/test_v006_experiments.py tests/test_computation.py -q"
    - id: GATE_FULL
      command: "uv run pytest -q"
    - id: GATE_VALIDATE
      command: "uv run python -m godspeed_nav.cli validate --workspace-root . --storage-root .godspeed-harness/validation"
    - id: GATE_DOCS
      command: "uv run pytest tests/test_docs_alignment.py -q"
  gate_binding_rule: "Reuse existing gates; v006 adds its own test modules rather than competing surfaces."
  proof_levels:
    P0: "mechanical — narrow gate"
    P1: "behavioral + teeth"
    P2: "invariant-sensitive (leakage, purity, balance) — adversarial teeth + evidence"
    P3: "settlement-critical (preregistered experiments, adoption, runtime) — frozen preregistration + fresh independent confirmation"

