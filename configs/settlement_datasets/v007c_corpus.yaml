# v007c corrected trajectory corpus configuration (correction slice C1).
#
# Rebuild of the v007 corpus with per-event context scoping (v007
# critique MAJOR-1): every event gains "ctx" = number of context
# messages strictly below its turn index, derived at stream time from
# the adapter's context_positions(raw).  Sources, revisions, splits,
# limits, and the usability rule are IDENTICAL to
# configs/settlement_datasets/v007_corpus.yaml, so parents keep their
# v007 identity (ctx is excluded from the trajectory content hash) and
# only the additive ctx/context_scoped/trailing_context fields differ.
# The v007 corpus (data/settlement_datasets/corpora/v007-trajectories/)
# is preserved untouched; the corrected corpus lands in a NEW root
# (data/settlement_datasets/corpora/v007c-trajectories/) and the build
# summary is written next to the v007 summary without overwriting it
# (data/settlement_datasets/runs/v007-recovery/corpus_summary_c1.json).
#
# Usability rule (identical to v006/v007): a parent is accepted iff its
# terminal label is defined (outcome.success is not None) AND outcome
# confidence >= min_confidence.

corpus_id: v007c-trajectories
min_confidence: 0.65
settlement_classification: external-proxy-settlement
usability_rule: >-
  parent accepted iff terminal label defined (outcome.success is not None)
  AND outcome confidence >= 0.65

datasets:
  - name: swegym_openhands
    source_uri: SWE-Gym/OpenHands-Sampled-Trajectories
    adapter: swegym_openhands
    split: train.raw
    max_rows: 3000
    revision_sha: baf3a4e4bff514d48ddc08a93a2ade5c126212c7
    license_status: "ambiguous (dataset card declares no license; companion repo SWE-Gym/SWE-Gym is Apache-2.0)"

  - name: nebius_swe_agent
    source_uri: nebius/SWE-agent-trajectories
    adapter: nebius_swe_agent
    split: train
    max_rows: 5000
    revision_sha: 68195a1450865274106246d0d0296a1d6807b88e
    license_status: "identified: cc-by-4.0"

  - name: swe_smith
    source_uri: SWE-bench/SWE-smith-trajectories
    adapter: swe_smith
    split: tool
    max_rows: 5000
    revision_sha: 08e109b4a59eaeebf80e4675cd125d42e7ac99a4
    license_status: "identified: mit"
