# =============================================================================
# TASK CONTRACTS
# =============================================================================

tasks:

  T01a:
    title: "Dataset research: additional failure-bearing trajectory source"
    initial_status: ready
    depends_on: []
    proof_level: P1
    confirmation: builder_with_main_agent_review
    settles: ["REQ-V007-DATA"]
    changes: "No code. Produces .agents/reports/v007-dataset-research.md screening candidate public agent-trajectory datasets for failure-episode admissibility."
    proves: "Each candidate carries (or lacks) genuine execution failures, observable post-failure behavior, defensible terminal outcomes, stable parent IDs, usable licensing — with cited evidence; an explicit ADMIT/REJECT verdict per candidate."
    does_not_prove: "That an admitted source yields enough episodes (T02)."
    hot_context:
      - "Candidates to screen first: SWE-bench/SWE-smith-trajectories, R2E-Gym trajectory datasets (e.g. R2E-Gym/R2E-Gym-Traj*), SWE-Gym/SWE-Gym (original), nebius/SWE-agent-trajectories re-check (v006 found no is_error events — confirm at observation level whether error text exists in any observation-like field), plus any NeoHorse-referenced outcome-labeled set."
      - "Six admissibility conditions from v006 (identifiable parents; causal order; actions/observations distinguishable; defensible terminal label; no label leak; license)."
    steps:
      - "Inspect HF API metadata + schema + sample rows (streaming, small limits) per candidate."
      - "Determine whether tool/execution outputs with error content are observable (test error-keyword incidence on samples)."
      - "Write the screening table + verdicts."
    gate:
      - "report exists with per-candidate evidence and verdicts"
    teeth:
      - attack: "A candidate whose 'success' field is a synthesis/LLM-judge artifact."
        expected: "REJECT verdict, not admission."
    redesign_trigger: "If every candidate fails admissibility, record it and proceed single-source (REQ-V007-DATA allows this) — do not lower standards."
    evidence: ".agents/reports/v007-dataset-research.md"
    done_when:
      - "At least one candidate investigated to a cited ADMIT/REJECT verdict; licensing recorded."

  T01b:
    title: "Episode construction + recovery features + tests"
    initial_status: ready
    depends_on: []
    proof_level: P2
    confirmation: builder_with_main_agent_review
    settles: ["REQ-V007-EPISODE", "REQ-V007-TARGET", "REQ-V007-POINTS", "REQ-V007-FEATURES", "REQ-V007-SPLITS"]
    changes: "New scripts/settlement_datasets/v007_recovery.py + configs/settlement_datasets/v007_episodes.yaml + tests/test_v007_episodes.py + tests/test_v007_features.py. Implements failure-episode extraction over v006 corpus parents exactly per coordinator_decisions; R0/R1 windows; recovery_success labeling with label-audit buckets; R0 feature schema (v006 families recomputed at k_failure + episode-positional features: raw event index of failure, prior episode count, prior escape count — all causal); R1 additions (attempt repeats preceding action hash; attempt family vs pre-failure action family change; observations between failure and attempt; same-failure immediate repeat). Minimal v005-compatible recovery feature subset preregistered for the representation ablation."
    proves: "Episodes match the frozen definition (test-proven on crafted synthetic parents + fixtures); labels derive only from escape + terminal outcome; feature windows at R0/R1 are causally closed (future-event mutation invariance); grouping keys carry dataset:repository; parent-balanced weights computed over training episodes."
    does_not_prove: "That the features predict recovery (T03)."
    hot_context:
      - "scripts/settlement_datasets/v006_features.py (reuse extractors at arbitrary k; do NOT fork formulas)"
      - "KNOWN: nebius parents have zero is_error events — episode builder must handle a source with no episodes gracefully and report it."
      - "KNOWN: exclude final-event error observations (counted exclusion bucket)."
    steps:
      - "Implement build_failure_episodes(parent) -> list of episode records (ids, cut indices, label, audit buckets)."
      - "Implement r0_features / r1_features reusing v006 extractors + episode additions; expose schema constants + assert helpers."
      - "Tests: episode definition edge cases (opening context errors, consecutive-error runs, trailing-error exclusion, no-post-failure-action R1 absence, label audit buckets), causal purity (mutation after cut), grouping, weights, determinism, no-leak schema assertions."
    gate:
      - "uv run pytest tests/test_v007_episodes.py tests/test_v007_features.py -q"
    teeth:
      - attack: "Mutate events strictly after R0/R1 cuts."
        expected: "Feature vectors bit-identical."
      - attack: "Craft a parent where escape exists but terminal label = 0 (and its mirror)."
        expected: "Labels 0 and 1 respectively; escape alone never suffices."
      - attack: "Two parents of the same repository split across partitions in a helper."
        expected: "Grouping guard refuses."
    redesign_trigger: "If swegym episodes prove too few or too degenerate (e.g., all errors confined to context), stop and surface rather than redefining episodes silently."
    evidence: "scripts/settlement_datasets/v007_recovery.py + tests"
    done_when:
      - "Episode builder + features + tests green; real-corpus episode counts + label balance + audit buckets reported."

  T02:
    title: "Preregistration freeze (embeds coordinator decisions + T01a verdicts)"
    initial_status: blocked
    depends_on: ["T01a", "T01b"]
    proof_level: P3
    confirmation: main_agent
    settles: ["REQ-V007-PREREG"]
    changes: "Writes .agents/reports/v007-experiment-preregistration.yaml embedding coordinator_decisions verbatim plus: admitted datasets (T01a verdicts + revisions + licenses), final R0/R1 feature schemas (from T01b real schemas), episode yield counts, weighting rules, hyperparameter bounds, primary/secondary metrics, calibration rule, acceptance criteria. Frozen (committed) before the final training run."
    proves: "The executed system is fully determined by the frozen file; nothing endpoint-relevant is chosen after seeing test results."
    does_not_prove: "Any performance claim."
    steps:
      - "Draft after T01a/T01b evidence; main agent reviews and freezes."
    gate:
      - "file exists; sha256 recorded in experiment manifest later; committed before results artifacts"
    redesign_trigger: "If T01b evidence contradicts a coordinator decision (e.g., label audit buckets pathological), STOP and re-decide explicitly before freezing — never silently."
    evidence: ".agents/reports/v007-experiment-preregistration.yaml"
    done_when:
      - "Frozen preregistration committed; covers every REQ-V007-PREREG item."

  T03:
    title: "Recovery experiment runner + execution"
    initial_status: blocked
    depends_on: ["T02"]
    proof_level: P3
    confirmation: independent_adversarial
    settles: ["REQ-V007-MODELS", "REQ-V007-EVALUATION", "REQ-V007-HYPOTHESES"]
    changes: "New scripts/settlement_datasets/run_v007_experiments.py + tests/test_v007_experiments.py + .agents/reports/v007-experiment-results.md + artifacts under data/settlement_datasets/runs/v007-recovery/. Executes R-LR and R-LGBM at R0 and R1 (plus the preregistered representation ablation), with grouping/weight/calibration discipline identical in kind to v006; reports every REQ-V007-EVALUATION item; mechanical acceptance verdicts."
    proves: "Whether LightGBM's interaction exploitation beats LogisticRegression on recoverability; whether the NeoHorse-derived representation earns its keep over minimal recovery features; all secondary reporting present."
    does_not_prove: "Runtime usefulness in the local harness; deployment readiness."
    preregistration:
      required: true
      artifact: ".agents/reports/v007-experiment-preregistration.yaml"
      claim: "As frozen (primary + secondary hypotheses with exact thresholds)."
      falsifier: "R-LGBM ≤ R-LR at both points, or gains identity-dependent, or representation gain absent at same estimator."
      known_confounds:
        - "episode multiplicity within parents (parent-balanced weights + parent-aggregated secondary metric)"
        - "escape-in-label vs features separation (mutation tests)"
        - "single-source dominance (per-source/macro reporting; source-balanced sensitivity if trigger fires)"
      confirmation_condition: "Fresh critic (T04) finds no leakage/label/weighting defect and reproduces the headline comparison from raw artifacts."
    steps:
      - "Runner + tests (grouping guard, label-column whitelist, calibration-on-OOF-only, determinism, acceptance-rule micro-fixture)."
      - "Execute; persist predictions/metrics/manifest; write results report with representative examples."
    gate:
      - "uv run pytest tests/test_v007_experiments.py -q"
      - "prereg sha256 precedes artifacts; all preregistered cells present"
    teeth:
      - attack: "Escape/terminal fields among features."
        expected: "Whitelist refuses (tested)."
      - attack: "Ungrouped split helper."
        expected: "Runner refuses (tested)."
    independent_confirmation:
      verifier_receives: ["preregistration", "episode builder + feature code", "runner", "raw artifacts"]
      verifier_should_not_receive: ["builder's narrative conclusions until primary checks done"]
      required_verdict: "CONFIRM or REJECT with evidence"
    redesign_trigger: "Blocked/underpowered preregistered endpoints → stop, document, re-preregister explicitly."
    evidence: "data/settlement_datasets/runs/v007-recovery/"
    done_when:
      - "All preregistered cells executed and persisted; mechanical verdicts recorded; gates green."

  T04:
    title: "Independent critic audit"
    initial_status: blocked
    depends_on: ["T03"]
    proof_level: P3
    confirmation: independent_adversarial
    settles: ["REQ-V007-EVIDENCE"]
    changes: "No implementation. Fresh critic audits: failure-detection defensibility; recovery-label consequence legitimacy; future-event leakage; parent/task leakage; repeated-episode weighting; source dependence; calibration; terminal-outcome encoding in features; conclusion-vs-preregistration fidelity. Produces .agents/reports/v007-critique.md (BLOCKER/MAJOR/MINOR/NOTE + verdict)."
    proves: "An unconfounded auditor cannot break the chain — or findings are fixed and re-verified."
    does_not_prove: "Generalization beyond admitted sources."
    steps:
      - "Critic re-derives episodes/labels on samples, re-runs purity attacks, reproduces headline metrics, then cross-checks the builder narrative."
    gate:
      - ".agents/reports/v007-critique.md exists with verdict"
    teeth:
      - attack: "Critic attempts to forge a leak explanation that survives scrutiny."
        expected: "Disproven by targeted test, or the finding stands."
    redesign_trigger: "BLOCKER → back to owning task, failed evidence preserved."
    evidence: ".agents/reports/v007-critique.md"
    done_when:
      - "Verdict recorded; main agent independently verified findings."

  T05:
    title: "Runtime posture + final report"
    initial_status: blocked
    depends_on: ["T04"]
    proof_level: P2
    confirmation: main_agent
    settles: ["REQ-V007-RUNTIME", "REQ-V007-REPORT"]
    changes: "Runtime posture decision recorded (no auto-deploy; advisory-signal-first; if earned, document the intended control surface as future work — no policy decisions implemented); final report .agents/reports/godspeed-agent-v007-recovery-final.md with every mandated section ending in exactly one classification + smallest next move; plan/current_status/CURRENT_STATE refreshed; gates run."
    proves: "Repository green; docs match reality; conclusions follow from preregistered metrics."
    does_not_prove: "Anything beyond admitted sources."
    steps:
      - "Run global gates; write report; refresh memory files; commit."
    gate:
      - "uv run pytest -q"
      - "uv run python -m godspeed_nav.cli validate --workspace-root . --storage-root .godspeed-harness/validation"
    teeth:
      - attack: "git diff v006 run dirs against HEAD."
        expected: "No modifications."
    redesign_trigger: "Global-gate failure blocks settlement until corrected."
    evidence: ".agents/reports/godspeed-agent-v007-recovery-final.md"
    done_when:
      - "All gates green; report complete with exactly one classification; memory refreshed."

# -----------------------------------------------------------------------------
# FINAL ACCEPTANCE
# -----------------------------------------------------------------------------
final_acceptance:
  experiment_integrity:
    - "Failure episodes match the frozen definition; labels carry observable consequence (escape + verified settlement), never actions/claims."
    - "No future-event leakage (mutation-test-proven); no group across partitions; parent-balanced weights honored."
    - "R0/R1 reported separately; per-source/macro/LOSO/identity-removed/calibration/importance/examples all present."
  hypotheses:
    - "Primary and secondary hypotheses decided mechanically from frozen criteria; negative results reported honestly."
  runtime:
    - "No auto-deployment; posture recorded; advisory-only boundary stated."
  reporting:
    - "Final report ends with exactly one classification + smallest next move; gates green; v006 untouched."

# -----------------------------------------------------------------------------
# GUARDRAILS
# -----------------------------------------------------------------------------
guardrails:
  - "Do not modify v006 artifacts, configs, or reported results."
  - "No external API dependencies beyond existing HF streaming; no global installs."
  - "Recovery predictions advisory; no controller policy decisions implemented in v007."
  - "No trajectory-content commits from ambiguous-license sources."
  - "No invented labels/datasets; admissibility enforced; exclusions documented."
  - "Preregistration frozen before final training; final test evaluates, never redesigns."

